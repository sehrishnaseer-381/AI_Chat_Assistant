
services:
  db:
    image: postgres:17
    container_name: ai_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_assistant
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
